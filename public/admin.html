<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AFTER DARK - Admin Panel</title>
    <style>
        body { background: #0c0c0c; color: #fff; font-family: sans-serif; padding: 30px; margin: 0; }
        .top-bar { display: flex; gap: 10px; margin-bottom: 20px; }
        input[type="password"] { padding: 10px; background: #1c1c1c; border: 1px solid #333; color: #fff; border-radius: 4px; }
        button.btn-load { background: #ff1e27; border: none; color: #fff; padding: 10px 18px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #292929; padding: 12px; text-align: left; }
        th { background: #191919; color: #ff1e27; text-transform: uppercase; font-size: 13px; }
        .btn-approve { background: #008f39; color: #fff; border:none; padding: 8px 14px; cursor: pointer; border-radius: 4px; font-weight: bold;}
        .btn-approve:hover { background: #00b047; }
        .status-APPROVED { color: #00ff66; font-weight: bold; }
        .status-PENDING { color: #ffae00; font-weight: bold; }
    </style>
</head>
<body>
    <h2>Booking Management Dashboard</h2>
    <div class="top-bar">
        <input type="password" id="adminPass" placeholder="Enter Admin Password">
        <button class="btn-load" onclick="loadBookings()">Load Data</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>Booking ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Tickets</th>
                <th>Amount</th>
                <th>UTR / Ref Number</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>

    <script>
        async function loadBookings() {
            const pass = document.getElementById('adminPass').value;
            const res = await fetch(`/api/admin/bookings?password=${encodeURIComponent(pass)}`);
            if (res.status === 401) return alert('Invalid Password');
            const data = await res.json();
            
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            data.forEach(row => {
                tbody.innerHTML += `
                    <tr>
                        <td><strong>${row.user_id}</strong></td>
                        <td>${row.name}</td>
                        <td>${row.email}</td>
                        <td>${row.phone}</td>
                        <td>${row.tickets}</td>
                        <td>₹${row.amount}</td>
                        <td style="color:#ff4d4d; font-family:monospace; font-size:15px;">${row.utr_number}</td>
                        <td class="status-${row.status}">${row.status}</td>
                        <td>
                            ${row.status === 'PENDING' ? `<button class="btn-approve" onclick="approveBooking(${row.id})">Approve & Send Ticket</button>` : 'Verified'}
                        </td>
                    </tr>
                `;
            });
        }

        async function approveBooking(id) {
            const pass = document.getElementById('adminPass').value;
            const res = await fetch(`/api/admin/approve/${id}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: pass })
            });
            const data = await res.json();
            if (data.success) {
                alert('Ticket approved & sent to customer email successfully.');
                loadBookings();
            } else {
                alert('Failed to process approval.');
            }
        }
    </script>
</body>
</html>
