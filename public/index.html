<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AFTER DARK | Pass Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div class="poster-column">
        <img src="assets/poster.jpg" alt="After Dark Event Poster">
    </div>

    <div class="form-column">
        <h2>Book Passes</h2>
        <p class="subtitle">Entry: ₹499/- per person | Sept 19 • 6:00 PM</p>
        
        <form id="bookingForm">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="name" required placeholder="Enter full name">
            </div>
            <div class="form-group">
                <label>Email (Passes will be sent here)</label>
                <input type="email" id="email" required placeholder="example@gmail.com">
            </div>
            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" id="phone" required placeholder="10-digit mobile number">
            </div>
            <div class="form-group">
                <label>Number of Tickets</label>
                <select id="tickets">
                    <option value="1">1 Person - ₹499</option>
                    <option value="2">2 Persons - ₹998</option>
                    <option value="3">3 Persons - ₹1497</option>
                    <option value="4">4 Persons - ₹1996</option>
                </select>
            </div>
            <button type="submit" class="btn-submit">PROCEED TO PAY</button>
        </form>
    </div>
</div>

<!-- Payment Verification Modal -->
<div class="modal" id="paymentModal">
    <div class="modal-content">
        <h3 style="color: #ff1e27; margin:0 0 10px 0;">SCAN TO PAY</h3>
        <p style="font-size: 13px; color:#aaa; margin:0;">Palukuri Mohan Maneesh</p>
        
        <div class="qr-box">
            <img src="assets/qr.png" alt="PhonePe QR Code">
        </div>
        
        <div class="upi-id">UPI: 8125204068-4@ybl</div>
        
        <form id="paymentConfirmForm">
            <div class="form-group" style="text-align: left;">
                <label>UTR / Transaction ID / Ref No.</label>
                <input type="text" id="utr_number" required placeholder="Enter 12-digit UTR number">
            </div>
            <button type="submit" class="btn-submit">CONFIRM BOOKING</button>
        </form>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
